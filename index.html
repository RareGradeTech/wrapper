<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Wrapper Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base Light Theme Reset */
        body, html {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Google Sans', 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        /* Subtle Background Glows (Gemini Colors) */
        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(66, 133, 244, 0.08) 0%, rgba(155, 114, 203, 0.05) 40%, rgba(255,255,255,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Hero Section Layout */
        .hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            z-index: 1;
        }

        /* Typography */
        h1 {
            font-size: 4.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
            background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.25rem;
            color: #475569;
            max-width: 650px;
            margin-bottom: 3rem;
            line-height: 1.7;
            font-weight: 300;
        }

        /* --- 3D Atom Animation --- */
        .atom-container {
            position: relative;
            width: 450px;
            height: 450px;
            perspective: 1200px;
            margin-top: 2rem;
            margin-bottom: 3rem;
            /* Slight tilt to view the atom in 3D space */
            transform: rotateX(15deg) rotateY(15deg);
            cursor: pointer;
        }

        /* Central AI Core (Glassmorphism) */
        .ai-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateY(-15deg) rotateX(-15deg); /* Counter parent tilt */
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.8rem;
            color: #4285f4;
            box-shadow: 0 10px 30px rgba(66, 133, 244, 0.15), inset 0 0 20px rgba(155, 114, 203, 0.1);
            z-index: 10;
        }

        /* 3D Orbit Rings */
        .orbit-ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(66, 133, 244, 0.15);
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        /* Tilting the rings to form an atom shape */
        .ring-1 { transform: rotateX(65deg) rotateY(0deg); }
        .ring-2 { transform: rotateX(65deg) rotateY(60deg); }
        .ring-3 { transform: rotateX(65deg) rotateY(120deg); }

        /* The invisible track that spins */
        .orbit-track {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transform-style: preserve-3d;
            animation: spinTrack 12s linear infinite;
        }
        
        /* Staggering the animation speeds and directions */
        .ring-2 .orbit-track { animation-duration: 16s; animation-direction: reverse; }
        .ring-3 .orbit-track { animation-duration: 20s; }

        @keyframes spinTrack {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }

        /* The Avatar Positioning Parent */
        .avatar {
            position: absolute;
            top: -25px; /* Offset by half the height to center on the line */
            left: calc(50% - 25px);
            width: 50px;
            height: 50px;
            /* Counter-spin so the element stays upright in 3D space */
            animation: counterSpinTrack 12s linear infinite;
        }

        .ring-2 .avatar { animation-duration: 16s; animation-direction: reverse; }
        .ring-3 .avatar { animation-duration: 20s; }

        @keyframes counterSpinTrack {
            0% { transform: rotateZ(0deg) rotateX(-90deg); }
            100% { transform: rotateZ(-360deg) rotateX(-90deg); }
        }

        /* The Actual Image Elements */
        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
            object-fit: cover;
            display: block;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Hover & Touch Infinite Spin Trigger --- */
        /* Targets mouse hover and mobile screen touch/active states on the atom area */
        .atom-container:hover .avatar img,
        .atom-container:active .avatar img {
            animation: infinitePropellerSpin 1.5s linear infinite;
        }

        @keyframes infinitePropellerSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Glassmorphism CTA Button */
        .cta-btn {
            padding: 1.2rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #4285f4, #9b72cb);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(66, 133, 244, 0.3);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(66, 133, 244, 0.4);
        }
        
        /* Mobile Optimization */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .atom-container { width: 300px; height: 300px; }
            .avatar { width: 40px; height: 40px; top: -20px; left: calc(50% - 20px); }
            .ai-core { width: 80px; height: 80px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <section class="hero">
        <h1>The Ultimate AI Wrapper</h1>
        <p>Seamlessly integrate powerful AI models into your workflows. Watch the network expand in 3D as human intelligence orbits around core AI architecture.</p>
        
        <div class="atom-container">
            <div class="ai-core">AI</div>
            
            <div class="orbit-ring ring-1">
                <div class="orbit-track">
                    <div class="avatar">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Human User">
                    </div>
                </div>
            </div>

            <div class="orbit-ring ring-2">
                <div class="orbit-track">
                    <div class="avatar">
                        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=100&q=80" alt="Human User">
                    </div>
                </div>
            </div>

            <div class="orbit-ring ring-3">
                <div class="orbit-track">
                    <div class="avatar">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Human User">
                    </div>
                </div>
            </div>
        </div>

        <button class="cta-btn">Start Building</button>
    </section>

</body>
</html>
