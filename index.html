<!DOCTYPE html>
<html lang="en)
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Wrapper Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght=300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base Light Theme Reset */
        body, html {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Google Sans', 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        /* Subtle Background Glows (Gemini Colors) */
        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(66, 133, 244, 0.08) 0%, rgba(155, 114, 203, 0.05) 40%, rgba(255,255,255,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Hero Section Layout */
        .hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            z-index: 1;
        }

        /* Typography */
        h1 {
            font-size: 4.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
            background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.25rem;
            color: #475569;
            max-width: 650px;
            margin-bottom: 3rem;
            line-height: 1.7;
            font-weight: 300;
        }

        /* --- 3D Atom Animation --- */
        .atom-container {
            position: relative;
            width: 450px;
            height: 450px;
            perspective: 1200px;
            margin-top: 2rem;
            margin-bottom: 3rem;
            /* Slight tilt to view the atom in 3D space */
            transform: rotateX(15deg) rotateY(15deg);
        }

        /* Central AI Core (Glassmorphism) */
        .ai-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateY(-15deg) rotateX(-15deg); /* Counter parent tilt */
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.8rem;
            color: #4285f4;
            box-shadow: 0 10px 30px rgba(66, 133, 244, 0.15), inset 0 0 20px rgba(155, 114, 203, 0.1);
            z-index: 10;
        }

        /* 3D Orbit Rings */
        .orbit-ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(66, 133, 244, 0.15);
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        /* Tilting the rings to form an atom shape */
        .ring-1 { transform: rotateX(65deg) rotateY(0deg); }
        .ring-2 { transform: rotateX(65deg) rotateY(60deg); }
        .ring-3 { transform: rotateX(65deg) rotateY(120deg); }

        /* The invisible track that spins */
        .orbit-track {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transform-style: preserve-3d;
            animation: spinTrack 12s linear infinite;
        }
        
        /* Staggering the animation speeds and directions */
        .ring-2 .orbit-track { animation-duration: 16s; animation-direction: reverse; }
        .ring-3 .orbit-track { animation-duration: 20s; }

        @keyframes spinTrack {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }

        /* The Human Avatars */
        .avatar {
            position: absolute;
            top: -25px; /* Offset by half the height to center on the line */
            left: calc(50% - 25px);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
            object-fit: cover;
            /* Counter-spin so the image stays upright in 3D space */
            animation: counterSpinTrack 12s linear infinite;
        }

        .ring-2 .avatar { animation-duration: 16s; animation-direction: reverse; }
        .ring-3 .avatar { animation-duration: 20s; }

        @keyframes counterSpinTrack {
            0% { transform: rotateZ(0deg) rotateX(-90deg); }
            100% { transform: rotateZ(-360deg) rotateX(-90deg); }
        }

        /* --- AI Hand Overlay --- */
        .ai-hand {
            position: absolute;
            /* Positioned relative to the atom container, reaching inward from the left screen space */
            right: 100%; 
            top: 50%;
            width: 280px;
            height: auto;
            margin-right: -40px; /* Adjusts finger close to the AI core */
            z-index: 20;
            pointer-events: none;
            /* Counteract the 3D tilt of the atom container so hand remains flat/readable */
            transform: translateY(-50%) rotateY(-15deg) rotateX(-15deg) translateX(-150px);
            opacity: 0;
            filter: drop-shadow(0px 15px 25px rgba(66, 133, 244, 0.15));
            animation: handEmergeAndPoint 2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
        }

        /* Combination entry and constant idle hover keyframes */
        @keyframes handEmergeAndPoint {
            0% {
                opacity: 0;
                transform: translateY(-50%) rotateY(-15deg) rotateX(-15deg) translateX(-150px);
            }
            100% {
                opacity: 1;
                transform: translateY(-50%) rotateY(-15deg) rotateX(-15deg) translateX(0);
                /* Link to subtle floating animation seamlessly */
                animation: handIdleFloat 4s ease-in-out infinite alternate;
            }
        }

        @keyframes handIdleFloat {
            0% {
                transform: translateY(-50%) rotateY(-15deg) rotateX(-15deg) translateX(0);
            }
            100% {
                transform: translateY(-53%) rotateY(-13deg) rotateX(-13deg) translateX(-5px);
            }
        }

        /* Glassmorphism CTA Button */
        .cta-btn {
            padding: 1.2rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #4285f4, #9b72cb);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(66, 133, 244, 0.3);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(66, 133, 244, 0.4);
        }
        
        /* Mobile Optimization */
        @media (max-width: 1024px) {
            /* Hide or adapt the hand on small screens to prevent covering up central content layout */
            .ai-hand {
                display: none;
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .atom-container { width: 300px; height: 300px; }
            .avatar { width: 40px; height: 40px; top: -20px; left: calc(50% - 20px); }
            .ai-core { width: 80px; height: 80px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <section class="hero">
        <h1>The Ultimate AI Wrapper</h1>
        <p>Seamlessly integrate powerful AI models into your workflows. Watch the network expand in 3D as human intelligence orbits around core AI architecture.</p>
        
        <div class="atom-container">
            
            <svg class="ai-hand" viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#4285f4" stop-opacity="0.2"/>
                        <stop offset="60%" stop-color="#9b72cb" stop-opacity="0.8"/>
                        <stop offset="100%" stop-color="#d96570"/>
                    </linearGradient>
                </defs>
                <path d="M10 45 L50 43 L80 47 L110 40 L140 45 L150 50 L140 55 L80 55 Z" fill="url(#handGradient)" />
                <circle cx="80" cy="47" r="3" fill="#ffffff" opacity="0.7"/>
                <circle cx="110" cy="40" r="3" fill="#ffffff" opacity="0.9"/>
                <circle cx="140" cy="45" r="2.5" fill="#ffffff"/>
                <path d="M140 45 L185 45 C190 45, 190 41, 185 41 L140 41 Z" fill="url(#handGradient)" stroke="#ffffff" stroke-width="0.5"/>
                <circle cx="185" cy="43" r="4" fill="#d96570" />
                <circle cx="185" cy="43" r="1.5" fill="#ffffff" />
                <path d="M135 49 C142 49, 145 56, 135 57" stroke="#9b72cb" stroke-width="2" stroke-linecap="round"/>
                <path d="M130 54 C137 54, 140 61, 130 62" stroke="#9b72cb" stroke-width="2" stroke-linecap="round"/>
            </svg>

            <div class="ai-core">AI</div>
            
            <div class="orbit-ring ring-1">
                <div class="orbit-track">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Human User" class="avatar">
                </div>
            </div>

            <div class="orbit-ring ring-2">
                <div class="orbit-track">
                    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=100&q=80" alt="Human User" class="avatar">
                </div>
            </div>

            <div class="orbit-ring ring-3">
                <div class="orbit-track">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Human User" class="avatar">
                </div>
            </div>
        </div>

        <button class="cta-btn">Start Building</button>
    </section>

</body>
</html>
